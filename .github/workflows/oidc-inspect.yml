name: Inspect protected environment OIDC claims
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect claims or verify retire login with a read-only Azure query
        type: choice
        default: existing-claims
        options: [existing-claims, retire-claims, retire-login]
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: >-
          ${{ fromJSON(inputs.mode == 'existing-claims'
          && '["build","prod-kr","prod-sea","prod-usw","prod-rollback-kr","prod-rollback-sea","prod-rollback-usw"]'
          || '["retire-kr","retire-sea","retire-usw"]') }}
    environment: ${{ matrix.environment }}
    env:
      INSPECT_ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Print and persist only allowlisted metadata (never bearer JWT)
        run: python scripts/inspect_oidc.py
      - uses: actions/upload-artifact@v4
        with:
          name: oidc-claims-${{ github.run_id }}-${{ matrix.environment }}
          path: state/claims-${{ matrix.environment }}.json
          if-no-files-found: error
          retention-days: 7
      - uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        if: inputs.mode == 'retire-login'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify read access to the regional Container App
        if: inputs.mode == 'retire-login'
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.CONTAINER_APP }}
        run: az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" --only-show-errors --output none
