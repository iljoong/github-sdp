name: Safe ACA release - Korea then Southeast Asia then West US
on:
  workflow_dispatch:
    inputs:
      profile:
        description: production = 3 x 1h per region; demo = educational synthetic short bake
        type: choice
        options: [production, demo]
        default: production
permissions:
  contents: read
concurrency:
  group: safe-aca-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
    with:
      version_prefix: r
  korea:
    needs: build
    uses: ./.github/workflows/region.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      region: kr
      environment: prod-kr
      profile: ${{ inputs.profile }}
  southeastasia:
    needs: korea
    if: needs.korea.result == 'success'
    uses: ./.github/workflows/region.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      region: sea
      environment: prod-sea
      profile: ${{ inputs.profile }}
  westus:
    needs: southeastasia
    if: needs.southeastasia.result == 'success'
    uses: ./.github/workflows/region.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      region: usw
      environment: prod-usw
      profile: ${{ inputs.profile }}
