name: Protected restore from original release baseline
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Original release run ID, NOT this restore run ID
        required: true
        type: string
      region:
        description: all attempts Brazil then Germany then Korea; unstarted region has no snapshot and fails safely
        required: true
        type: choice
        options: [all, kr, de, br]
        default: all
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: safe-aca-production
  cancel-in-progress: false
jobs:
  brazil:
    if: github.ref == 'refs/heads/main' && (inputs.region == 'all' || inputs.region == 'br')
    uses: ./.github/workflows/restore-region.yml
    with:
      region: br
      environment: prod-rollback-br
      source_run_id: ${{ inputs.source_run_id }}
  germany:
    needs: brazil
    if: always() && github.ref == 'refs/heads/main' && (inputs.region == 'all' || inputs.region == 'de')
    uses: ./.github/workflows/restore-region.yml
    with:
      region: de
      environment: prod-rollback-de
      source_run_id: ${{ inputs.source_run_id }}
  korea:
    needs: germany
    if: always() && github.ref == 'refs/heads/main' && (inputs.region == 'all' || inputs.region == 'kr')
    uses: ./.github/workflows/restore-region.yml
    with:
      region: kr
      environment: prod-rollback-kr
      source_run_id: ${{ inputs.source_run_id }}
