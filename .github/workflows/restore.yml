name: Protected restore from original release baseline
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Original release run ID, NOT this restore run ID
        required: true
        type: string
      region:
        description: all attempts West US then Southeast Asia then Korea; unstarted region has no snapshot and fails safely
        required: true
        type: choice
        options: [all, kr, sea, usw]
        default: all
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: safe-aca-production
  cancel-in-progress: false
jobs:
  westus:
    if: github.ref == 'refs/heads/main' && (inputs.region == 'all' || inputs.region == 'usw')
    uses: ./.github/workflows/restore-region.yml
    with:
      region: usw
      environment: prod-rollback-usw
      source_run_id: ${{ inputs.source_run_id }}
  southeastasia:
    needs: westus
    if: always() && github.ref == 'refs/heads/main' && (inputs.region == 'all' || inputs.region == 'sea')
    uses: ./.github/workflows/restore-region.yml
    with:
      region: sea
      environment: prod-rollback-sea
      source_run_id: ${{ inputs.source_run_id }}
  korea:
    needs: southeastasia
    if: always() && github.ref == 'refs/heads/main' && (inputs.region == 'all' || inputs.region == 'kr')
    uses: ./.github/workflows/restore-region.yml
    with:
      region: kr
      environment: prod-rollback-kr
      source_run_id: ${{ inputs.source_run_id }}
